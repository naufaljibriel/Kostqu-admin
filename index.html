<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KostKu Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sidebar navigasi + area kerja (desktop); di HP jadi bottom-nav seperti aplikasi APK */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EBEEF4; --ink:#151A26; --muted:#5D6578; --line:#DFE3EB;
  --accent:#2C4CD4; --accent-ink:#FFFFFF; --accent-soft:#E6EBFC;
  --ok:#17905F; --ok-soft:#DFF3E9; --warn:#B57A00; --warn-soft:#FAEFD3;
  --bad:#CC3B31; --bad-soft:#FAE3E1; --fix:#7450C4; --fix-soft:#EEE7FA; --empty:#8E95A6;
  --shadow:0 10px 30px rgba(21,26,38,.14);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F121A; --surface:#171B25; --sunk:#1D2230; --ink:#E7EAF1; --muted:#9CA3B5; --line:#2A3040;
  --accent:#7D93FF; --accent-ink:#0F121A; --accent-soft:#1F2747;
  --ok:#3CC88C; --ok-soft:#132A20; --warn:#E5B23B; --warn-soft:#2D2510;
  --bad:#F0695E; --bad-soft:#341A1B; --fix:#A98CF0; --fix-soft:#261E3A; --empty:#6D7488;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121A; --surface:#171B25; --sunk:#1D2230; --ink:#E7EAF1; --muted:#9CA3B5; --line:#2A3040;
  --accent:#7D93FF; --accent-ink:#0F121A; --accent-soft:#1F2747;
  --ok:#3CC88C; --ok-soft:#132A20; --warn:#E5B23B; --warn-soft:#2D2510;
  --bad:#F0695E; --bad-soft:#341A1B; --fix:#A98CF0; --fix-soft:#261E3A; --empty:#6D7488;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:-3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;padding:0 7px;border-radius:99px;font-weight:700}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px}

.main{min-width:0;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.top h1{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.top .date{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.content{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px;margin:0;font-weight:700}
.panel-h .link{margin-left:auto}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.eyebrow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi .v.bad{color:var(--bad)}

.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.loc{padding:16px;display:flex;flex-direction:column;gap:12px}
.loc-h{display:flex;align-items:flex-start;gap:10px}
.loc-h b{font-size:15px}
.loc-h .code{margin-left:auto;font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:2px 8px;border-radius:6px;color:var(--muted)}
.occ{display:flex;align-items:baseline;gap:8px}
.occ .v{font-family:var(--f-display);font-size:28px;font-weight:800}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.loc dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:0;font-size:13px}
.loc dt{color:var(--muted)} .loc dd{margin:0;text-align:right;font-weight:600}

.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.list{list-style:none;margin:0;padding:4px 0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 16px}
.list li+li{border-top:1px solid var(--line)}
.list .who{min-width:0;flex:1}
.list .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .who small{color:var(--muted);font-size:12px}
.empty{padding:22px 16px;color:var(--muted);font-size:13px;text-align:center}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-fix{background:var(--fix-soft);color:var(--fix)}
.p-none{background:var(--sunk);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11.5px}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}

.floor{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:12px 16px}
.floor+.floor{border-top:1px dashed var(--line)}
.floor-l{font-size:12px;color:var(--muted);font-weight:600;padding-top:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.tile{position:relative;border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:left;background:var(--surface);min-height:54px;display:flex;flex-direction:column;gap:2px;border-left-width:4px}
.tile:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tile .c{font-family:var(--f-mono);font-weight:700;font-size:13px}
.tile .t{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.terisi{border-left-color:var(--ok)}
.tile.kosong{border-left-color:var(--empty);background:var(--sunk)}
.tile.booking{border-left-color:var(--warn)}
.tile.perbaikan{border-left-color:var(--fix);background:var(--fix-soft)}
.tile .late{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
.tile.dim{opacity:.25}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
td.r,th.r{text-align:right}

.sumstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.sumstrip>div{padding:14px 16px}
.sumstrip>div+div{border-left:1px solid var(--line)}
.sumstrip .v{font-family:var(--f-display);font-weight:800;font-size:21px;margin-top:2px}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ok)}

.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.kcol{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.kcol h3{font-size:13px;margin:4px 6px;display:flex;gap:8px;align-items:center}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ticket .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ticket b{font-weight:600}

.overlay{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-h .big{font-family:var(--f-mono);font-size:26px;font-weight:700;line-height:1}
.drawer-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex:1}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.x{margin-left:auto;border:0;background:var(--sunk);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}

.modal{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.modal form{padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-family:var(--f-display);font-size:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.modal.wide{width:min(580px,calc(100% - 32px))}
.facs{display:flex;flex-wrap:wrap;gap:6px}
.fac{font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:6px;background:var(--sunk)}
.facgroup{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px}
.facgroup-h{font-size:13px;font-weight:700}
.facpick{display:flex;flex-wrap:wrap;gap:6px}
.fchk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;user-select:none}
.fchk input{accent-color:var(--accent);margin:0}
.fchk:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.addline{display:flex;gap:6px}
.addline input{flex:1;min-width:0;border:1px dashed var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.err:empty{display:none}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.loc.add{border:1.5px dashed var(--line);background:none;color:var(--accent);font-weight:700;font-size:15px;align-items:center;justify-content:center;gap:4px;min-height:160px;border-radius:12px}
.loc.add:hover{border-color:var(--accent);background:var(--accent-soft)}
.loc.add small{color:var(--muted);font-weight:500;font-size:12.5px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:13px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

.bnav{display:none}
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:21px}
  .seg{margin-left:0;width:100%}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
  .bnav button[aria-current="true"]{color:var(--accent)}
  .bnav svg{width:20px;height:20px}
  .bnav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;padding:0 5px;border-radius:99px}
  .kanban{grid-template-columns:1fr}
  .sumstrip{grid-template-columns:1fr 1fr}
  .sumstrip>div:nth-child(3){border-left:0}
  .sumstrip>div:nth-child(n+3){border-top:1px solid var(--line)}
  .floor{grid-template-columns:1fr;gap:6px}
  .floor-l{padding-top:0}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  .kpi .v{font-size:25px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">KK</div><div><b>KostKu</b><small>Admin pengelola</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Prototype · data contoh<br>Perubahan hilang saat halaman dimuat ulang.</div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="title">Ringkasan</h1><div class="date">Senin, 26 Oktober 2026</div></div>
      <div class="seg" id="locseg" role="group" aria-label="Pilih lokasi"></div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="layer"></div>

<script>
// ---------- Data contoh (deterministik) ----------
const TODAY = new Date(2026, 9, 26);
const DAY = 864e5;
const PERIOD = 'Oktober 2026';
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = mulberry(20261026);
const pick = a => a[Math.floor(R()*a.length)];

const LOCS = [
  {id:'MLT', code:'M', name:'Kos Melati', area:'Jatinangor, Sumedang', floors:4, perFloor:10, price:{Standar:850000, AC:1250000, VIP:1650000}},
  {id:'KNG', code:'K', name:'Kos Kenanga', area:'Dago, Bandung', floors:3, perFloor:12, price:{Standar:1100000, AC:1550000, VIP:2100000}},
  {id:'AGR', code:'A', name:'Kos Anggrek', area:'Ciumbuleuit, Bandung', floors:3, perFloor:10, price:{Standar:1000000, AC:1400000, VIP:1900000}},
];
const FIRST = ['Rizky','Ayu','Dimas','Putri','Fajar','Nadia','Bagus','Salsa','Arif','Intan','Yoga','Dewi','Raka','Citra','Hendra','Laras','Galih','Nabila','Ilham','Tiara','Aldi','Siti','Bima','Wulan','Reza','Anisa','Teguh','Rani','Farhan','Mega','Yusuf','Kirana','Dani','Febri','Gita','Hafiz','Indah','Joko','Lutfi','Maya'];
const LAST = ['Pratama','Lestari','Saputra','Rahmawati','Nugraha','Hidayat','Wijaya','Kusuma','Permana','Anggraini','Setiawan','Maulana','Puspita','Firmansyah','Ramadhan','Utami','Gunawan','Sari'];
const ISSUES = {
  Listrik:['MCB sering turun','Stop kontak tidak berfungsi','Lampu kamar mandi mati'],
  Air:['Keran wastafel bocor','Air shower kecil','Kloset mampet'],
  AC:['AC tidak dingin','AC menetes air','Remote AC hilang'],
  Kunci:['Kunci pintu macet','Gembok lemari rusak'],
  Internet:['WiFi lantai ini lemot','Sinyal WiFi putus-putus'],
  Kebersihan:['Lorong depan kamar kotor','Tempat sampah penuh'],
};

// daftar fasilitas per kategori; admin bisa menambah item & kategori sendiri
const FAC = [
  {cat:'Fasilitas kamar', items:['Kasur','Meja','Kursi','Lemari','Kipas angin','AC','Jendela']},
  {cat:'Kamar mandi', items:['Kamar mandi dalam','Water heater','Shower','Wastafel']},
  {cat:'Lainnya', items:['WiFi','TV','Balkon','Kulkas mini']},
];
function defaultFac(type){
  const f = ['Kasur','Meja','Kursi','Lemari','Jendela','WiFi'];
  if (type === 'Standar') f.push('Kipas angin');
  else f.push('AC','Kamar mandi dalam','Shower');
  if (type === 'VIP') f.push('Water heater','Wastafel','TV');
  return f;
}

const rooms = [], tenants = [], invoices = [], tickets = [];
let seq = 1;
const phone = () => '08' + pick(['12','13','21','52','57','77','95']) + '-' + String(Math.floor(R()*9000)+1000) + '-' + String(Math.floor(R()*9000)+1000);

for (const L of LOCS) {
  for (let f = 1; f <= L.floors; f++) {
    for (let n = 1; n <= L.perFloor; n++) {
      const type = n > L.perFloor - 2 ? 'VIP' : (f === 1 && R() < .75 ? 'Standar' : (R() < .3 ? 'Standar' : 'AC'));
      const r = { id:'r'+seq++, code:roomCode(L, f, n), num:n, loc:L.id, floor:f, type, price:L.price[type], fac:defaultFac(type), status:'kosong', tenantId:null, booking:null };
      const x = R();
      if (x < .85) {
        r.status = 'terisi';
        const since = new Date(TODAY.getTime() - (30 + Math.floor(R()*820)) * DAY);
        const t = { id:'t'+seq++, name:pick(FIRST)+' '+pick(LAST), phone:phone(), roomId:r.id, since, dueDay:Math.min(since.getDate(),28),
          job: R() < .7 ? 'Mahasiswa' : 'Karyawan', deposit:r.price, active:true };
        tenants.push(t); r.tenantId = t.id;
        const due = new Date(2026, 9, t.dueDay);
        const paid = due < TODAY ? R() < .86 : R() < .3;
        invoices.push({ id:'i'+seq++, tenantId:t.id, roomId:r.id, amount:r.price, due, paidAt: paid ? new Date(due.getTime() - Math.floor(R()*4)*DAY) : null });
      } else if (x < .90) {
        r.status = 'booking';
        r.booking = { name:pick(FIRST)+' '+pick(LAST), date:new Date(2026, 10, 1 + Math.floor(R()*10)) };
      } else if (x < .95) {
        r.status = 'perbaikan';
      }
      rooms.push(r);
    }
  }
}
// tiket perawatan
const cats = Object.keys(ISSUES);
for (const r of rooms.filter(r => r.status === 'perbaikan')) {
  const c = pick(['Listrik','Air','AC']);
  tickets.push({ id:'k'+seq++, roomId:r.id, cat:c, title:pick(ISSUES[c]), prio:'Tinggi', status:'proses', created:new Date(TODAY.getTime() - Math.floor(R()*6+1)*DAY) });
}
const occupied = rooms.filter(r => r.status === 'terisi');
for (let i = 0; i < 13; i++) {
  const r = pick(occupied), c = pick(cats);
  tickets.push({ id:'k'+seq++, roomId:r.id, cat:c, title:pick(ISSUES[c]), prio:pick(['Rendah','Sedang','Sedang','Tinggi']),
    status: i < 6 ? 'baru' : i < 9 ? 'proses' : 'selesai', created:new Date(TODAY.getTime() - Math.floor(R()*12)*DAY) });
}

// ---------- Helper ----------
function roomCode(L, f, n){ return L.code + f + String(n).padStart(2, '0'); }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + n.toLocaleString('id-ID');
const rpShort = n => n >= 1e9 ? 'Rp' + (n/1e9).toLocaleString('id-ID',{maximumFractionDigits:2}) + ' M' : n >= 1e6 ? 'Rp' + (n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1}) + ' jt' : rp(n);
const dfmt = d => d.toLocaleDateString('id-ID', {day:'numeric', month:'short'});
const dlong = d => d.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
const byId = (arr, id) => arr.find(x => x.id === id);
const locOf = r => byId(LOCS, r.loc);
const roomOf = id => byId(rooms, id);
const tenantOf = r => r.tenantId ? byId(tenants, r.tenantId) : null;
const invOfTenant = t => invoices.find(i => i.tenantId === t.id);
const daysLate = inv => Math.round((TODAY - inv.due) / DAY);
function invState(inv){
  if (inv.paidAt) return 'lunas';
  return inv.due < TODAY ? 'telat' : 'belum';
}
const STATE_PILL = { lunas:['p-ok','Lunas'], telat:['p-bad','Telat'], belum:['p-warn','Belum bayar'] };
const ROOM_PILL = { terisi:['p-ok','Terisi'], kosong:['p-none','Kosong'], booking:['p-warn','Booking'], perbaikan:['p-fix','Perbaikan'] };
const pill = ([c, t]) => `<span class="pill ${c}">${t}</span>`;
const PRIO = { Tinggi:'p-bad', Sedang:'p-warn', Rendah:'p-none' };

// ---------- State tampilan ----------
const S = { view:'ringkasan', loc:'all', rstatus:'all', q:'', bill:'semua', drawer:null, modal:null, armed:null };
const inLoc = r => S.loc === 'all' || r.loc === S.loc;

const ICONS = {
  ringkasan:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  kamar:'<path d="M3 21V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v16M16 9h3a2 2 0 0 1 2 2v10M1 21h22M12 12h.01"/>',
  penyewa:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  tagihan:'<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .67V2l-1 .67L16 4l-3-2-3 2-3-2zM8 8h8M8 12h8M8 16h5"/>',
  perawatan:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
};
const VIEWS = [['ringkasan','Ringkasan'],['kamar','Kamar'],['penyewa','Penyewa'],['tagihan','Tagihan'],['perawatan','Perawatan']];
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

// ---------- Hitungan ----------
function stats(locId){
  const rs = rooms.filter(r => locId === 'all' || r.loc === locId);
  const c = { total:rs.length, terisi:0, kosong:0, booking:0, perbaikan:0 };
  rs.forEach(r => c[r.status]++);
  const ids = new Set(rs.map(r => r.id));
  const inv = invoices.filter(i => ids.has(i.roomId));
  const target = inv.reduce((a, i) => a + i.amount, 0);
  const got = inv.filter(i => i.paidAt).reduce((a, i) => a + i.amount, 0);
  const late = inv.filter(i => invState(i) === 'telat');
  const lateSum = late.reduce((a, i) => a + i.amount, 0);
  const potential = rs.reduce((a, r) => a + r.price, 0);
  return { ...c, occ: c.total ? Math.round(c.terisi / c.total * 100) : 0, target, got, late, lateSum, potential };
}

// ---------- Render ----------
function render(){
  const lateCount = stats('all').late.length;
  const openTickets = tickets.filter(t => t.status !== 'selesai').length;
  const badge = k => k === 'tagihan' && lateCount ? lateCount : k === 'perawatan' && openTickets ? openTickets : 0;
  $('#nav').innerHTML = VIEWS.map(([k, l]) => `<button data-go="${k}" aria-current="${S.view === k}">${svg(k)}${l}${badge(k) ? `<span class="badge">${badge(k)}</span>` : ''}</button>`).join('');
  $('#bnav').innerHTML = VIEWS.map(([k, l]) => `<button data-go="${k}" aria-current="${S.view === k}">${svg(k)}${l}${badge(k) ? `<span class="badge">${badge(k)}</span>` : ''}</button>`).join('');
  $('#locseg').innerHTML = [['all','Semua lokasi'], ...LOCS.map(l => [l.id, l.name.replace('Kos ', '')])]
    .map(([id, l]) => `<button data-loc="${id}" aria-pressed="${S.loc === id}">${l}</button>`).join('');
  $('#title').textContent = VIEWS.find(v => v[0] === S.view)[1];
  $('#content').innerHTML = ({ ringkasan:vRingkasan, kamar:vKamar, penyewa:vPenyewa, tagihan:vTagihan, perawatan:vPerawatan })[S.view]();
  renderLayer();
}

function vRingkasan(){
  const st = stats(S.loc);
  const locs = LOCS.filter(l => S.loc === 'all' || l.id === S.loc);
  const pct = st.target ? Math.round(st.got / st.target * 100) : 0;

  const lateList = st.late.slice().sort((a, b) => daysLate(b) - daysLate(a));
  const upcoming = [];
  tenants.filter(t => t.active && inLoc(roomOf(t.roomId))).forEach(t => {
    const inv = invOfTenant(t);
    let next = inv && !inv.paidAt ? inv.due : new Date(2026, 10, t.dueDay);
    const d = Math.round((next - TODAY) / DAY);
    if (d >= 0 && d <= 7) upcoming.push({ t, next, d });
  });
  upcoming.sort((a, b) => a.d - b.d);
  const urgent = tickets.filter(k => k.status !== 'selesai' && inLoc(roomOf(k.roomId)))
    .sort((a, b) => (a.prio === 'Tinggi' ? 0 : 1) - (b.prio === 'Tinggi' ? 0 : 1) || a.created - b.created);

  return `
  <div class="note">Prototype dengan data contoh: ${rooms.length} kamar di 3 lokasi. Semua tombol bisa dicoba, tapi perubahan hilang saat halaman dimuat ulang.</div>
  <section class="kpis">
    <div class="panel kpi"><div class="eyebrow">Okupansi</div><div class="v num">${st.occ}%</div><div class="s">${st.terisi} dari ${st.total} kamar terisi</div></div>
    <div class="panel kpi"><div class="eyebrow">Terkumpul ${PERIOD}</div><div class="v num">${rpShort(st.got)}</div><div class="s">${pct}% dari tagihan ${rpShort(st.target)}</div></div>
    <div class="panel kpi"><div class="eyebrow">Tunggakan</div><div class="v num ${st.late.length ? 'bad' : ''}">${st.late.length} orang</div><div class="s">Total ${rp(st.lateSum)}</div></div>
    <div class="panel kpi"><div class="eyebrow">Siap disewakan</div><div class="v num">${st.kosong} kamar</div><div class="s">${st.booking} booking · ${st.perbaikan} dalam perbaikan</div></div>
  </section>

  <section class="locs">${locs.map(l => {
    const s = stats(l.id);
    const seg = (n, c) => `<i style="width:${s.total ? n / s.total * 100 : 0}%;background:var(${c})"></i>`;
    return `<div class="panel loc">
      <div class="loc-h"><div><b>${l.name}</b><div class="muted" style="font-size:12.5px">${l.area} · ${l.floors} lantai · ${s.total} kamar</div></div><span class="code">${l.code}</span></div>
      <div class="occ"><span class="v num">${s.occ}%</span><span class="muted">terisi</span></div>
      <div class="bar">${seg(s.terisi, '--ok')}${seg(s.booking, '--warn')}${seg(s.perbaikan, '--fix')}</div>
      <div class="legend"><span><i class="dot" style="background:var(--ok)"></i>${s.terisi} terisi</span><span><i class="dot" style="background:var(--warn)"></i>${s.booking} booking</span><span><i class="dot" style="background:var(--fix)"></i>${s.perbaikan} perbaikan</span><span><i class="dot" style="background:var(--empty)"></i>${s.kosong} kosong</span></div>
      <dl><dt>Terkumpul bulan ini</dt><dd class="num">${rp(s.got)}</dd><dt>Tunggakan</dt><dd class="num" style="color:${s.late.length ? 'var(--bad)' : 'inherit'}">${s.late.length} · ${rp(s.lateSum)}</dd><dt>Potensi jika penuh</dt><dd class="num">${rp(s.potential)}</dd></dl>
    </div>`; }).join('')}${S.loc === 'all' ? '<button class="loc add" data-addbldg>+ Tambah gedung<small>Cabang kos baru beserta kamarnya</small></button>' : ''}
  </section>

  <section class="cols3">
    <div class="panel"><div class="panel-h"><h2>Telat bayar</h2><span class="pill p-bad">${lateList.length}</span><button class="link" data-go="tagihan" data-bill="telat">Lihat semua</button></div>
      ${lateList.length ? `<ul class="list">${lateList.slice(0, 6).map(i => { const t = byId(tenants, i.tenantId), r = roomOf(i.roomId);
        return `<li><div class="who"><b>${esc(t.name)}</b><small><span class="mono">${r.code}</span> · telat ${daysLate(i)} hari · ${rp(i.amount)}</small></div><button class="btn sm" data-remind="${i.id}">Salin pengingat</button></li>`; }).join('')}</ul>` : '<div class="empty">Tidak ada tunggakan. Mantap!</div>'}
    </div>
    <div class="panel"><div class="panel-h"><h2>Jatuh tempo 7 hari</h2><span class="pill p-warn">${upcoming.length}</span></div>
      ${upcoming.length ? `<ul class="list">${upcoming.slice(0, 6).map(u => { const r = roomOf(u.t.roomId);
        return `<li><div class="who"><b>${esc(u.t.name)}</b><small><span class="mono">${r.code}</span> · ${rp(r.price)}</small></div><span class="pill p-none num">${u.d === 0 ? 'Hari ini' : dfmt(u.next)}</span></li>`; }).join('')}</ul>` : '<div class="empty">Tidak ada jatuh tempo minggu ini.</div>'}
    </div>
    <div class="panel"><div class="panel-h"><h2>Perawatan terbuka</h2><span class="pill p-fix">${urgent.length}</span><button class="link" data-go="perawatan">Buka papan</button></div>
      ${urgent.length ? `<ul class="list">${urgent.slice(0, 6).map(k => { const r = roomOf(k.roomId);
        return `<li><div class="who"><b>${esc(k.title)}</b><small><span class="mono">${r.code}</span> · ${k.cat} · ${k.status === 'baru' ? 'Baru' : 'Dikerjakan'}</small></div><span class="pill ${PRIO[k.prio]}">${k.prio}</span></li>`; }).join('')}</ul>` : '<div class="empty">Semua beres.</div>'}
    </div>
  </section>`;
}

function vKamar(){
  const rs = rooms.filter(inLoc);
  const cnt = s => s === 'all' ? rs.length : rs.filter(r => r.status === s).length;
  const q = S.q.trim().toLowerCase();
  const match = r => (S.rstatus === 'all' || r.status === S.rstatus) &&
    (!q || r.code.toLowerCase().includes(q) || tenantOf(r)?.name.toLowerCase().includes(q) || r.fac.some(f => f.toLowerCase().includes(q)));
  const locs = LOCS.filter(l => S.loc === 'all' || l.id === S.loc);
  return `
  <div class="toolbar">
    <div class="chips">${[['all','Semua'],['terisi','Terisi'],['kosong','Kosong'],['booking','Booking'],['perbaikan','Perbaikan']].map(([k, l]) =>
      `<button class="chip" data-rstatus="${k}" aria-pressed="${S.rstatus === k}">${k !== 'all' ? `<i class="dot" style="background:var(${({terisi:'--ok',kosong:'--empty',booking:'--warn',perbaikan:'--fix'})[k]})"></i>` : ''}${l}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="Cari no. kamar, nama, atau fasilitas…" value="${esc(S.q)}">
    <div class="tb-actions"><button class="btn" data-addbldg>+ Tambah gedung</button><button class="btn primary" data-addroom="">+ Tambah kamar</button></div>
  </div>
  <div class="legend"><span><i class="dot" style="background:var(--bad)"></i>Titik merah: penyewa telat bayar</span><span>Klik kamar untuk detail &amp; aksi</span></div>
  ${locs.map(l => `<div class="panel">
    <div class="panel-h"><h2>${l.name}</h2><span class="muted" style="font-size:12.5px">${l.area}</span><button class="btn sm" data-addroom="${l.id}" style="margin-left:auto">+ Kamar</button></div>
    ${Array.from({length:l.floors}, (_, i) => i + 1).map(f => `<div class="floor"><div class="floor-l">Lantai ${f}</div><div class="tiles">
      ${rs.some(r => r.loc === l.id && r.floor === f) ? '' : '<span class="muted" style="font-size:12.5px;padding:8px 0">Belum ada kamar di lantai ini.</span>'}${rs.filter(r => r.loc === l.id && r.floor === f).map(r => { const t = tenantOf(r); const inv = t && invOfTenant(t);
        const label = r.status === 'terisi' ? t.name.split(' ')[0] : r.status === 'booking' ? 'Booking' : r.status === 'perbaikan' ? 'Perbaikan' : 'Kosong · ' + r.type;
        return `<button class="tile ${r.status} ${match(r) ? '' : 'dim'}" data-room="${r.id}" aria-label="Kamar ${r.code}, ${r.status}"><span class="c">${r.code}</span><span class="t">${esc(label)}</span>${inv && invState(inv) === 'telat' ? '<span class="late" title="Telat bayar"></span>' : ''}</button>`; }).join('')}
    </div></div>`).join('')}
  </div>`).join('')}`;
}

function vPenyewa(){
  const q = S.q.trim().toLowerCase();
  const list = tenants.filter(t => t.active && inLoc(roomOf(t.roomId)) && (!q || t.name.toLowerCase().includes(q) || roomOf(t.roomId).code.toLowerCase().includes(q)))
    .sort((a, b) => roomOf(a.roomId).code.localeCompare(roomOf(b.roomId).code));
  return `
  <div class="toolbar"><input class="search" id="q" type="search" placeholder="Cari nama atau no. kamar…" value="${esc(S.q)}"><span class="muted">${list.length} penyewa aktif</span></div>
  <div class="panel tablewrap"><table>
    <thead><tr><th>Nama</th><th>Kamar</th><th>Lokasi</th><th>No. HP</th><th>Masuk sejak</th><th>Jatuh tempo</th><th>${PERIOD}</th></tr></thead>
    <tbody>${list.map(t => { const r = roomOf(t.roomId), inv = invOfTenant(t);
      return `<tr class="click" data-room="${r.id}"><td><b>${esc(t.name)}</b> <span class="muted" style="font-size:12px">· ${t.job}</span></td><td class="mono">${r.code}</td><td>${locOf(r).name}</td><td class="mono">${esc(t.phone)}</td><td class="num">${dlong(t.since)}</td><td class="num">Tiap tgl ${t.dueDay}</td><td>${inv ? pill(STATE_PILL[invState(inv)]) : ''}</td></tr>`; }).join('')}
    </tbody></table>${list.length ? '' : '<div class="empty">Tidak ada penyewa yang cocok.</div>'}</div>`;
}

function vTagihan(){
  const all = invoices.filter(i => inLoc(roomOf(i.roomId)));
  const target = all.reduce((a, i) => a + i.amount, 0);
  const sum = s => all.filter(i => invState(i) === s).reduce((a, i) => a + i.amount, 0);
  const got = sum('lunas');
  const tabs = [['semua','Semua',all.length],['telat','Telat',all.filter(i => invState(i) === 'telat').length],['belum','Belum jatuh tempo',all.filter(i => invState(i) === 'belum').length],['lunas','Lunas',all.filter(i => invState(i) === 'lunas').length]];
  const order = { telat:0, belum:1, lunas:2 };
  const list = all.filter(i => S.bill === 'semua' || invState(i) === S.bill)
    .sort((a, b) => order[invState(a)] - order[invState(b)] || a.due - b.due);
  return `
  <div class="panel sumstrip">
    <div><div class="eyebrow">Total tagihan</div><div class="v num">${rp(target)}</div><div class="muted" style="font-size:12px">${all.length} tagihan · ${PERIOD}</div></div>
    <div><div class="eyebrow">Terkumpul</div><div class="v num" style="color:var(--ok)">${rp(got)}</div><div class="progress"><i style="width:${target ? got / target * 100 : 0}%"></i></div></div>
    <div><div class="eyebrow">Telat</div><div class="v num" style="color:var(--bad)">${rp(sum('telat'))}</div></div>
    <div><div class="eyebrow">Belum jatuh tempo</div><div class="v num">${rp(sum('belum'))}</div></div>
  </div>
  <div class="chips">${tabs.map(([k, l, n]) => `<button class="chip" data-bill="${k}" aria-pressed="${S.bill === k}">${l}<span class="n">${n}</span></button>`).join('')}</div>
  <div class="panel tablewrap"><table>
    <thead><tr><th>Penyewa</th><th>Kamar</th><th>Jatuh tempo</th><th class="r">Jumlah</th><th>Status</th><th class="r">Aksi</th></tr></thead>
    <tbody>${list.map(i => { const t = byId(tenants, i.tenantId), r = roomOf(i.roomId), s = invState(i);
      const status = s === 'telat' ? `<span class="pill p-bad">Telat ${daysLate(i)} hari</span>` : s === 'lunas' ? `<span class="pill p-ok">Lunas ${dfmt(i.paidAt)}</span>` : pill(STATE_PILL.belum);
      return `<tr><td><b>${esc(t.name)}</b></td><td class="mono">${r.code}</td><td class="num">${dfmt(i.due)}</td><td class="r num">${rp(i.amount)}</td><td>${status}</td>
        <td class="r">${s === 'lunas' ? `<button class="btn sm" data-unpay="${i.id}">Batalkan</button>` : `<button class="btn sm" data-remind="${i.id}">Salin pengingat</button> <button class="btn sm primary" data-pay="${i.id}">Tandai lunas</button>`}</td></tr>`; }).join('')}
    </tbody></table>${list.length ? '' : '<div class="empty">Tidak ada tagihan di kategori ini.</div>'}</div>`;
}

function vPerawatan(){
  const ks = tickets.filter(k => inLoc(roomOf(k.roomId)));
  const cols = [['baru','Baru masuk'],['proses','Sedang dikerjakan'],['selesai','Selesai']];
  return `
  <div class="toolbar"><span class="muted">Catat keluhan penyewa supaya tidak ada yang terlewat. Kamar yang rusak berat bisa ditandai "Perbaikan" agar tidak ikut disewakan.</span><button class="btn primary" data-newticket style="margin-left:auto">+ Buat tiket</button></div>
  <div class="kanban">${cols.map(([k, l]) => { const list = ks.filter(x => x.status === k).sort((a, b) => b.created - a.created);
    return `<div class="kcol"><h3>${l}<span class="pill p-none">${list.length}</span></h3>
      ${list.map(x => { const r = roomOf(x.roomId);
        return `<div class="ticket"><div class="row"><span class="mono" style="font-weight:700">${r.code}</span><span class="muted" style="font-size:12px">${locOf(r).name}</span><span class="pill ${PRIO[x.prio]}" style="margin-left:auto">${x.prio}</span></div>
          <b>${esc(x.title)}</b><div class="row muted" style="font-size:12px"><span>${x.cat}</span><span>·</span><span>Dilaporkan ${dfmt(x.created)}</span></div>
          ${k !== 'selesai' ? `<div class="row"><button class="btn sm ${k === 'proses' ? 'primary' : ''}" data-advance="${x.id}">${k === 'baru' ? 'Mulai kerjakan' : 'Tandai selesai'}</button></div>` : ''}</div>`; }).join('') || '<div class="empty">Kosong</div>'}
    </div>`; }).join('')}
  </div>`;
}

function renderLayer(){
  let h = '';
  if (S.drawer) h += `<div class="overlay" data-close></div>` + drawerHTML(roomOf(S.drawer));
  if (S.modal) h += `<div class="overlay" data-closemodal style="z-index:21"></div>` + modalHTML();
  $('#layer').innerHTML = h;
  if ($('#ag-preview')) $('#ag-preview').innerHTML = gedungPreview();
  const first = $('#layer .modal input:not([type=hidden])');
  if (first && !S.modal.focused) { first.focus(); S.modal.focused = true; }
}

function drawerHTML(r){
  const L = locOf(r), t = tenantOf(r), inv = t && invOfTenant(t);
  const rt = tickets.filter(k => k.roomId === r.id).sort((a, b) => b.created - a.created);

  } else if (r.status === 'booking') {
    body += `<div class="box"><div class="eyebrow">Booking</div><div style="font-size:17px;font-weight:700">${esc(r.booking.name)}</div><div class="muted">Rencana masuk ${dlong(r.booking.date)}</div></div>`;
  } else if (r.status === 'perbaikan') {

    ${facGroups.length ? facGroups.map(g => `<div><div class="muted" style="font-size:12px;margin-bottom:5px">${esc(g.cat)}</div><div class="facs">${g.has.map(i => `<span class="fac">${esc(i)}</span>`).join('')}</div></div>`).join('') : '<div class="muted" style="font-size:13px">Belum ada fasilitas.</div>'}</div>`;
  body += `<div class="box"><div class="eyebrow">Riwayat perawatan</div>${rt.length ? `<ul class="list" style="margin:0 -14px">${rt.map(k => `<li><div class="who"><b>${esc(k.title)}</b><small>${k.cat} · ${dfmt(k.created)}</small></div>${pill(k.status === 'selesai' ? ['p-ok','Selesai'] : k.status === 'proses' ? ['p-fix','Dikerjakan'] : ['p-warn','Baru'])}</li>`).join('')}</ul>` : '<div class="muted" style="font-size:13px">Belum ada keluhan.</div>'}</div>`;

  let foot = '';
  if (r.status === 'kosong') foot = `<button class="btn primary" data-checkin="${r.id}">Check-in penyewa</button><button class="btn" data-setfix="${r.id}">Tandai perbaikan</button>`;

  if (r.status === 'terisi') foot = `<button class="btn danger ${S.armed === r.id ? 'armed' : ''}" data-checkout="${r.id}">${S.armed === r.id ? 'Yakin? Klik lagi untuk check-out' : 'Check-out penyewa'}</button>`;

      <div class="actions"><button type="button" class="btn" data-closemodal>Batal</button><button class="btn primary">Simpan kamar</button></div></form></div>`;

  return '';

// fasilitas baru masuk ke daftar kategori dan langsung dicentang untuk kamar ini
function addFac(gi){
  const inp = $('#nf-' + gi), name = inp.value.trim().replace(/\s+/g, ' ');
  if (!name) { inp.focus(); return; }
  const dr = S.modal.draft, exists = FAC.flatMap(g => g.items).find(i => i.toLowerCase() === name.toLowerCase());
  if (!exists) FAC[gi].items.push(name);
  const item = exists || name;
  if (!dr.fac.includes(item)) dr.fac.push(item);
  renderLayer(); $('#nf-' + gi).focus();
  toast(exists ? `"${item}" sudah ada di daftar, sekarang dicentang.` : `Fasilitas "${item}" ditambahkan.`);
}
function addCat(){
  const inp = $('#nc'), name = inp.value.trim().replace(/\s+/g, ' ');
  if (!name) { inp.focus(); return; }
  if (FAC.some(g => g.cat.toLowerCase() === name.toLowerCase())) { $('#er-err').textContent = `Kategori "${name}" sudah ada.`; return; }
  FAC.push({ cat:name, items:[] });
  renderLayer(); $('#nf-' + (FAC.length - 1)).focus();
  toast(`Kategori "${name}" dibuat. Tambahkan fasilitasnya.`);
}

// nomor kamar baru melanjutkan nomor terakhir di lantai tsb
function newNums(locId, floor, count){
  const used = rooms.filter(r => r.loc === locId && r.floor === floor).map(r => r.num);
  let n = used.length ? Math.max(...used) : 0;
  return Array.from({length:count}, () => ++n);
}
const clampCount = v => Math.max(1, Math.min(30, Math.floor(+v) || 1));
function kamarPreview(m){
  const L = byId(LOCS, m.locId), codes = newNums(L.id, m.floor, clampCount(m.count)).map(n => roomCode(L, m.floor, n));
  return `Nomor kamar baru: <b class="mono">${codes.length > 1 ? codes[0] + '–' + codes[codes.length - 1] : codes[0]}</b> (${codes.length} kamar, status kosong)`;
}
function readKamar(m){
  m.locId = $('#ar-loc').value; m.floor = +$('#ar-floor').value; m.rtype = $('#ar-type').value;
  m.price = +$('#ar-price').value || 0; m.count = $('#ar-count').value;
}
function gedungPreview(){
  const code = ($('#ag-code').value.trim() || '?').toUpperCase();
  const f = Math.max(1, +$('#ag-floors').value || 1), p = Math.max(0, +$('#ag-per').value || 0);
  return p ? `Akan dibuat ${f * p} kamar kosong, nomor <b class="mono">${code}101</b> sampai <b class="mono">${roomCode({code}, f, p)}</b>. Kamar bisa ditambah lagi nanti.`
    : 'Gedung dibuat tanpa kamar. Tambahkan kamar nanti lewat tombol "+ Kamar".';
}

// ---------- Interaksi ----------
let toastTimer;
function toast(msg){
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}

function reminderText(inv){
  const t = byId(tenants, inv.tenantId), r = roomOf(inv.roomId), L = locOf(r);
  return `Halo ${t.name}, ini pengingat dari ${L.name}. Sewa kamar ${r.code} periode ${PERIOD} sebesar ${rp(inv.amount)} jatuh tempo ${dlong(inv.due)}. Jika sudah transfer, mohon kirim bukti pembayaran ke nomor ini. Terima kasih.`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-close],[data-closemodal],tr[data-room]');
  if (!b) return;
  const d = b.dataset;
  if (d.go) { S.view = d.go; S.q = ''; if (d.bill) S.bill = d.bill; S.drawer = null; render(); scrollTo(0, 0); return; }
  if (d.loc) { S.loc = d.loc; render(); return; }
  if (d.rstatus) { S.rstatus = d.rstatus; render(); return; }
  if (d.bill) { S.bill = d.bill; render(); return; }
  if (d.room) { S.drawer = d.room; S.armed = null; renderLayer(); return; }
  if ('closemodal' in d) { S.modal = null; renderLayer(); return; }
  if ('close' in d) { S.drawer = null; S.armed = null; renderLayer(); return; }
  if (d.remind) {
    const txt = reminderText(byId(invoices, d.remind));
    const ok = () => toast('Pesan pengingat disalin. Tempel di WhatsApp penyewa.');
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(ok, () => toast(txt)); else toast(txt);
    return;
  }
  if (d.pay) { const i = byId(invoices, d.pay); i.paidAt = new Date(TODAY); toast(`Pembayaran ${byId(tenants, i.tenantId).name} dicatat lunas.`); render(); return; }
  if (d.unpay) { byId(invoices, d.unpay).paidAt = null; toast('Status lunas dibatalkan.'); render(); return; }
  if (d.advance) { const k = byId(tickets, d.advance); k.status = k.status === 'baru' ? 'proses' : 'selesai'; toast(k.status === 'selesai' ? 'Tiket ditandai selesai.' : 'Tiket mulai dikerjakan.'); render(); return; }
  if (d.checkin) { S.modal = { type:'checkin', roomId:d.checkin }; renderLayer(); return; }
  if ('newticket' in d) { const r = d.newticket ? roomOf(d.newticket) : null; S.modal = { type:'ticket', roomId:r?.id, locId: r ? r.loc : (S.loc === 'all' ? LOCS[0].id : S.loc) }; renderLayer(); return; }
  if (d.editroom) {
    const r = roomOf(d.editroom);
    S.modal = { type:'editroom', roomId:r.id, draft:{ code:r.code, type:r.type, price:r.price, fac:[...r.fac] } }; renderLayer(); return;
  }
  if ('addfac' in d) { addFac(+d.addfac); return; }
  if ('addcat' in d) { addCat(); return; }
  if ('addbldg' in d) { S.modal = { type:'gedung' }; renderLayer(); return; }
  if ('addroom' in d) {
    const L = byId(LOCS, d.addroom || (S.loc === 'all' ? LOCS[0].id : S.loc));
    S.modal = { type:'kamar', locId:L.id, floor:1, rtype:'AC', price:L.price.AC, count:1 }; renderLayer(); return;
  }
  if (d.setfix) { roomOf(d.setfix).status = 'perbaikan'; toast('Kamar ditandai dalam perbaikan.'); render(); return; }
  if (d.unfix) { const r = roomOf(d.unfix); r.status = 'kosong'; tickets.filter(k => k.roomId === r.id && k.status !== 'selesai').forEach(k => k.status = 'selesai'); toast(`Kamar ${r.code} siap disewakan lagi.`); render(); return; }
  if (d.cancelbook) { const r = roomOf(d.cancelbook); r.status = 'kosong'; r.booking = null; toast('Booking dibatalkan.'); render(); return; }
  if (d.checkout) {
    if (S.armed !== d.checkout) { S.armed = d.checkout; renderLayer(); return; }
    const r = roomOf(d.checkout), t = tenantOf(r);
    t.active = false; r.tenantId = null; r.status = 'kosong'; S.armed = null;
    toast(`${t.name} check-out. Kamar ${r.code} kini kosong.`); render(); return;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    S.q = e.target.value; const pos = e.target.selectionStart;
    $('#content').innerHTML = ({ kamar:vKamar, penyewa:vPenyewa })[S.view]();
    const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos);
  }
  if (e.target.id.startsWith('ag-')) $('#ag-preview').innerHTML = gedungPreview();
  if (e.target.id === 'er-code') S.modal.draft.code = e.target.value;
  if (e.target.id === 'er-price') S.modal.draft.price = e.target.value;
  if (e.target.id === 'ar-count' || e.target.id === 'ar-price') { readKamar(S.modal); $('#ar-preview').innerHTML = kamarPreview(S.modal); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'tk-loc') {
    const title = $('#tk-title').value;
    S.modal = { ...S.modal, locId:e.target.value, roomId:null }; renderLayer(); $('#tk-title').value = title;
  }
  if (e.target.id === 'ar-loc' || e.target.id === 'ar-type') {
    const m = S.modal; readKamar(m);
    if (e.target.id === 'ar-loc') m.floor = 1;
    m.price = byId(LOCS, m.locId).price[m.rtype]; renderLayer();
  }
  if (e.target.id === 'ar-floor') { readKamar(S.modal); $('#ar-preview').innerHTML = kamarPreview(S.modal); }
  if (e.target.id === 'er-type') {
    const dr = S.modal.draft; dr.type = e.target.value;
    dr.price = locOf(roomOf(S.modal.roomId)).price[dr.type]; $('#er-price').value = dr.price;
  }
  if (e.target.dataset.fac) {
    const dr = S.modal.draft, f = e.target.dataset.fac;
    dr.fac = e.target.checked ? [...dr.fac, f] : dr.fac.filter(x => x !== f);
    $('#er-count').textContent = `Fasilitas · ${dr.fac.length} dipilih`;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'fcheckin') {
    const r = roomOf(S.modal.roomId);
    const since = new Date($('#ci-date').value + 'T00:00:00');
    const t = { id:'t'+seq++, name:$('#ci-name').value.trim(), phone:$('#ci-phone').value.trim(), roomId:r.id, since,
      dueDay:Math.min(since.getDate(), 28), job:$('#ci-job').value, deposit:+$('#ci-dep').value || 0, active:true };
    tenants.push(t);
    invoices.push({ id:'i'+seq++, tenantId:t.id, roomId:r.id, amount:r.price, due:since, paidAt:since });
    r.status = 'terisi'; r.tenantId = t.id; r.booking = null;
    S.modal = null; toast(`${t.name} check-in ke kamar ${r.code}.`); render();
  }
  if (e.target.id === 'fticket') {
    tickets.push({ id:'k'+seq++, roomId:$('#tk-room').value, cat:$('#tk-cat').value, title:$('#tk-title').value.trim(), prio:$('#tk-prio').value, status:'baru', created:new Date(TODAY) });
    S.modal = null; toast('Tiket perawatan dibuat.'); render();
  }
  if (e.target.id === 'fedit') {
    const m = S.modal, r = roomOf(m.roomId), code = $('#er-code').value.trim().toUpperCase();
    const dup = rooms.find(x => x !== r && x.code === code);
    if (dup) { $('#er-err').textContent = `Nomor ${code} sudah dipakai kamar lain di ${locOf(dup).name}.`; $('#er-code').focus(); return; }
    const old = r.code;
    r.code = code; r.type = $('#er-type').value; r.price = +$('#er-price').value || 0;
    r.fac = FAC.flatMap(g => g.items).filter(i => m.draft.fac.includes(i));
    S.modal = null; toast(old === code ? `Kamar ${code} diperbarui.` : `Kamar ${old} diganti jadi ${code} dan diperbarui.`); render();
  }
  if (e.target.id === 'fgedung') {
    const code = $('#ag-code').value.trim().toUpperCase();
    const dup = LOCS.find(l => l.code === code);
    if (dup) { $('#ag-err').textContent = `Kode "${code}" sudah dipakai ${dup.name}. Pilih huruf lain.`; $('#ag-code').focus(); return; }
    const L = { id:'L'+seq++, code, name:$('#ag-name').value.trim(), area:$('#ag-area').value.trim(),
      floors:Math.max(1, Math.min(20, +$('#ag-floors').value || 1)), perFloor:Math.max(0, Math.min(50, +$('#ag-per').value || 0)),
      price:{ Standar:+$('#ag-ps').value || 0, AC:+$('#ag-pa').value || 0, VIP:+$('#ag-pv').value || 0 } };
    const type = $('#ag-type').value;
    LOCS.push(L);
    for (let f = 1; f <= L.floors; f++) for (let n = 1; n <= L.perFloor; n++)
      rooms.push({ id:'r'+seq++, code:roomCode(L, f, n), num:n, loc:L.id, floor:f, type, price:L.price[type], fac:defaultFac(type), status:'kosong', tenantId:null, booking:null });
    S.modal = null; S.loc = L.id; S.view = 'kamar'; S.rstatus = 'all';
    toast(`${L.name} ditambahkan dengan ${L.floors * L.perFloor} kamar.`); render();
  }
  if (e.target.id === 'fkamar') {
    const m = S.modal; readKamar(m);
    const L = byId(LOCS, m.locId), nums = newNums(L.id, m.floor, clampCount(m.count));
    nums.forEach(n => rooms.push({ id:'r'+seq++, code:roomCode(L, m.floor, n), num:n, loc:L.id, floor:m.floor, type:m.rtype, price:m.price, fac:defaultFac(m.rtype), status:'kosong', tenantId:null, booking:null }));
    if (m.floor > L.floors) L.floors = m.floor;
    S.modal = null; S.view = 'kamar';
    toast(`${nums.length} kamar ditambahkan ke ${L.name} lantai ${m.floor}.`); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset?.addfacInput) { e.preventDefault(); addFac(+e.target.dataset.addfacInput); return; }
  if (e.key === 'Enter' && e.target.id === 'nc') { e.preventDefault(); addCat(); return; }
  if (e.key === 'Escape') { if (S.modal) S.modal = null; else { S.drawer = null; S.armed = null; } renderLayer(); }
});

render();
</script>

</body>
</html>
